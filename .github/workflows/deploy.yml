name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: parmelae-bot-production-deploy
  cancel-in-progress: false

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Restore Bun install cache
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: bun-install-${{ runner.os }}-${{ hashFiles('bun.lock', '.bun-version') }}
          restore-keys: |
            bun-install-${{ runner.os }}-

      - name: Restore Prisma engine cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/prisma
          key: prisma-engines-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bunx prisma generate

      - name: Run checks (type check, lint, test)
        run: bun run checks

      - name: Build executable
        run: bun run build:executable

      - name: Prepare release bundle
        run: |
          install -d release/deploy release/prisma
          install -m 755 dist/parmelae-bot release/parmelae-bot
          install -m 755 deploy/activate-release.sh release/deploy/activate-release.sh
          cp -R prisma/migrations release/prisma/migrations

      - name: Upload release artifact
        uses: actions/upload-artifact@v6
        with:
          name: release-${{ github.sha }}
          path: release
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: ci
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Download release artifact
        uses: actions/download-artifact@v8
        with:
          name: release-${{ github.sha }}
          path: release

      - name: Configure SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "${{ secrets.KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Sync release to server
        env:
          DEPLOY_BASE: ${{ vars.DEPLOY_BASE }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
        run: |
          set -euo pipefail

          deploy_base="${DEPLOY_BASE:-/srv/parmelae-bot}"
          deploy_host="${DEPLOY_HOST:-jannis.rocks}"
          deploy_user="${DEPLOY_USER:-deploy-parmelae-bot}"
          release_id="${GITHUB_SHA}"
          remote_release_dir="${deploy_base}/releases/${release_id}"
          ssh_opts="-i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=yes"

          ssh $ssh_opts "${deploy_user}@${deploy_host}" "mkdir -p '${remote_release_dir}'"

          rsync -az --delete \
            -e "ssh $ssh_opts" \
            release/ \
            "${deploy_user}@${deploy_host}:${remote_release_dir}/"

      - name: Activate release
        env:
          DEPLOY_BASE: ${{ vars.DEPLOY_BASE }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          SERVICE_NAME: ${{ vars.PROD_SERVICE_NAME }}
        run: |
          set -euo pipefail

          deploy_base="${DEPLOY_BASE:-/srv/parmelae-bot}"
          deploy_host="${DEPLOY_HOST:-jannis.rocks}"
          deploy_user="${DEPLOY_USER:-deploy-parmelae-bot}"
          service_name="${SERVICE_NAME:-parmelae-bot}"
          release_id="${GITHUB_SHA}"
          remote_release_dir="${deploy_base}/releases/${release_id}"
          ssh_opts="-i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=yes"

          ssh $ssh_opts "${deploy_user}@${deploy_host}" "\
            chmod +x '${remote_release_dir}/deploy/activate-release.sh' '${remote_release_dir}/parmelae-bot' && \
            '${remote_release_dir}/deploy/activate-release.sh' \
              --base-dir '${deploy_base}' \
              --release '${release_id}' \
              --service '${service_name}'"

      - name: Remove SSH config
        if: always()
        run: rm -rf ~/.ssh
